name: Deploy Landing Page

# Sync monorepo landing code to the mirror repo, which deploys to Cloudflare
# with its own CLOUDFLARE_* secrets (see landing-page-solupair-check/DEPLOY.md).

on:
  push:
    branches:
      - master
    paths:
      - "landing-page-solupair-check/**"
      - ".github/workflows/deploy-landing-page.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-page
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout marineflow
        uses: actions/checkout@v4

      - name: Sync to landing-page-solupair
        env:
          SYNC_TOKEN: ${{ secrets.LANDING_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::Missing LANDING_SYNC_TOKEN repository secret."
            echo "Create a fine-grained PAT with contents:write on HMalepe/landing-page-solupair,"
            echo "then: gh secret set LANDING_SYNC_TOKEN --repo HMalepe/marineflow"
            exit 1
          fi

          git clone --depth 1 --branch main \
            "https://x-access-token:${SYNC_TOKEN}@github.com/HMalepe/landing-page-solupair.git" \
            mirror

          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.output' \
            --exclude '.wrangler' \
            landing-page-solupair-check/ mirror/

          cd mirror
          git add -A

          if git diff --staged --quiet; then
            echo "No landing changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from marineflow@${GITHUB_SHA::7}"
          git push origin main
